# Root-level CI pipeline for octo-adapter-weclapp (AB#4228), copied from
# octo-adapter-eda and adjusted; shared templates from
# octo-pipeline-templates + helm-chart-build.
#
# Deviations from the eda template:
#   - solutionFile is a .slnx (needs a current .NET SDK on the agents;
#     the repo builds net10.0, so this is given).
#   - A dotnet test step IS wired in (xUnit suite of the repo runs green).
#
# Kept from the template:
#   - download-ca — internal CA for dotnet restore.
#   - helm chart packaging + dev/release publishing via the
#     helm-chart-build companion repo (`adapter` category on
#     meshmakers.github.io/charts/, dev channel on every main build).
#   - NO push-nuget — this adapter publishes no NuGets.

name: $(MajorVersion).$(MinorVersion).$(date:yyMM).$(DayOfMonth)$(rev:rrr)-$(Build.SourceBranchName)

parameters:
  # Injected by a release train (hotfix-service) on r-tag builds so the whole
  # chain pins the scheduler-determined lib/comm release version (forwarded to
  # update-build-number.yml). Empty on normal branch CI / manual runs — there
  # the Directory.Build.props pin / floating range applies as before. The
  # 'auto' sentinel (stripped to '' on the forward) keeps the field optional in
  # the "Run pipeline" UI; an empty-string default would render as required.
  - name: octoCoreLibVersion
    type: string
    default: 'auto'
  - name: octoCommVersion
    type: string
    default: 'auto'

resources:
  repositories:
    - repository: pipelineTemplates
      type: github
      name: meshmakers/octo-pipeline-templates
      endpoint: meshmakers-access-token
      ref: refs/tags/tpl-v0.4.11
    - repository: helmChartBuild
      type: github
      name: meshmakers/helm-chart-build
      endpoint: meshmakers-access-token
      ref: refs/heads/main

trigger:
  batch: true
  branches:
    include:
      - dev/*
      - test/*
      - main
  tags:
    exclude:
      - '*'

variables:
  - group: ApiKeys-mm-cloud
  - group: OctoDefault
  - name: solutionFile
    value: 'Octo.WeClappAdapter.slnx'
  - name: artifactsFrameworkVersion
    value: 'net10.0'
  - name: buildConfiguration
    value: 'Release'
  - name: buildPlatform
    value: 'Any CPU'
  - name: isRelease
    value: ${{ startsWith(variables['Build.SourceBranch'], 'refs/tags/r') }}
  - name: isMain
    value: ${{ eq(variables['Build.SourceBranch'], 'refs/heads/main') }}
  - name: isTest
    value: ${{ startsWith(variables['Build.SourceBranch'], 'refs/heads/test') }}

stages:
  - stage: Build
    jobs:
      - job: linux
        displayName: 'Build, push Docker image, package chart'
        pool:
          name: meshmakers-ci-agents
        steps:
          - template: templates/steps/update-build-number.yml@pipelineTemplates
            parameters:
              octoCoreLibVersionOverride: ${{ replace(parameters.octoCoreLibVersion, 'auto', '') }}
              octoCommVersionOverride: ${{ replace(parameters.octoCommVersion, 'auto', '') }}
          # Sets $(ChartVersion) — 3-segment SemVer derived from
          # Build.BuildNumber. See helm-chart-build's docs/PUBLISHING.md.
          - template: ci-templates/derive-chart-version.yml@helmChartBuild
          - checkout: self
            clean: true
          - template: templates/steps/set-version.yml@pipelineTemplates
          - template: templates/steps/download-ca.yml@pipelineTemplates
          - task: DotNetCoreCLI@2
            displayName: 'Restore NuGet packages'
            inputs:
              command: 'restore'
              projects: '$(solutionFile)'
              restoreArguments: '--force /p:OctoNugetPrivateServer=$(nugetPrivateServer)'
              noCache: true
          - task: DotNetCoreCLI@2
            displayName: 'Build'
            inputs:
              command: 'build'
              projects: '$(solutionFile)'
              arguments: '--configuration $(buildConfiguration) /p:OctoNugetPrivateServer=$(nugetPrivateServer) /p:OctoPublishCatalog="$(effectivePublishCatalog)"'
              publishWebProjects: false
              zipAfterPublish: false
              modifyOutputPath: false
          - task: DotNetCoreCLI@2
            displayName: 'Test'
            inputs:
              command: 'test'
              projects: '$(solutionFile)'
              arguments: '--configuration $(buildConfiguration) --no-build /p:OctoNugetPrivateServer=$(nugetPrivateServer)'

          - template: templates/steps/build-and-push-docker.yml@pipelineTemplates
            parameters:
              publicRegistryServiceConnection: $(DockerRegistryPublicConnection)
              privateRegistryName: $(DockerRegistryPrivateUri)
              repository: meshmakers/octo-weclapp-adapter
              dockerfile: src/AdapterMeshWeClapp/Dockerfile
              platforms: 'linux/arm64,linux/amd64'
              enableMainLatestTag: true

          - task: HelmDeploy@0
            displayName: 'helm package octo-weclapp-adapter'
            inputs:
              command: package
              chartPath: '$(System.DefaultWorkingDirectory)/src/charts/octo-weclapp-adapter'
              chartVersion: '$(ChartVersion)'
              destination: '$(Build.artifactstagingdirectory)'
              arguments: '--app-version $(Build.BuildNumber) --dependency-update'

          # Dev (rolling) publish — every main build lands in helm-chart-build's
          # gh-pages dev catalog.
          - template: ci-templates/publish-helm-chart.yml@helmChartBuild
            parameters:
              channel: dev
              chartName: octo-weclapp-adapter
              chartVersion: $(ChartVersion)
              chartTgzPath: $(Build.artifactstagingdirectory)/octo-weclapp-adapter-$(ChartVersion).tgz
              githubTokenVariable: HelmChartBuildGhToken
              condition: and(succeeded(), eq(variables.isMain, true))

          # Release publish — only on r* tag, lands in
          # meshmakers.github.io/charts/ under the adapter category.
          - template: ci-templates/publish-helm-chart.yml@helmChartBuild
            parameters:
              channel: release
              chartCategory: adapter
              chartName: octo-weclapp-adapter
              chartVersion: $(ChartVersion)
              chartTgzPath: $(Build.artifactstagingdirectory)/octo-weclapp-adapter-$(ChartVersion).tgz
              githubTokenVariable: HelmChartBuildGhToken
              condition: and(succeeded(), eq(variables.isRelease, true))

          - template: templates/steps/handle-artifacts.yml@pipelineTemplates
