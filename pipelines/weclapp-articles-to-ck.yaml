# Pipeline: WeClapp articles → CK entities (Industry.Logistics/Article upsert, daily).
# Split from the AS file delivery (weclapp-articles-to-as.yaml): CK sync stays per-item —
# WeClappFetchStep@1 (emitMode PerItem) seeds $.articles = [{ item }, …] and a ForEach@1
# runs the former per-execution chain once per element (one iteration per article); the AS
# file is one Batch execution per run — two simple pipelines instead of one nested one.
# Deployment + key handling identical to weclapp-orders-to-ai.yaml (see its header for the
# source-verification status of the built-in sections).
#
# NOTE: supply-source enrichment is OFF here — this pipeline maps no purchase prices
# into CK, so the (expensive) full articleSupplySource pull would be discarded. The AS
# delivery pipeline keeps it on (EK-Preis field).

triggers:
  - type: FromPipelineTriggerEvent@1
  - type: FromExecutePipelineCommand@1

transformations:
  - type: WeClappFetchStep@1
    description: Fetch all WeClapp articles for CK sync (cron-driven; replaces the old WeClappFetch@1 poll-loop trigger)
    baseUrl: https://REPLACE-TENANT.weclapp.com/webapp/api/v1
    apiKey: ${WECLAPP_API_KEY}
    entity: article
    emitMode: PerItem              # $.articles = array of { item } — one ForEach iteration below per element
    enrichSupplySources: false     # CK maps no EK prices — skip the heaviest fetch
    pageSize: 100

  - type: ForEach@1
    description: per-item chain, one former execution per element
    iterationPath: $.articles
    keyPath: $.current
    # no mergePath: the default ($.key) merges nothing — nothing may read $.loopResult anyway,
    # and merging $.current would deep-clone every item’s full content into the result array.
    targetPath: $.loopResult         # NEVER omit: default "$" REPLACES the document root.
                                     # Merge-result ORDER is unspecified (ConcurrentBag) — nothing may read $.loopResult.
    maxDegreeOfParallelism: 1        # NEVER omit: default 0 = Environment.ProcessorCount (parallel!)
    transformations:
      - type: WeClappToCk@1
        description: WeClapp article → CK-shaped document (system articles filtered)
        mode: Article
        path: $.current.item
        targetPath: $.ck

      # --- CK persistence (built-ins; field names source-verified 2026-07-09,
      #     first tenant run pending — see weclapp-orders-to-ai.yaml header) ---
      - type: GetOrCreateRtEntitiesByType@1
        description: Upsert the Article by its WeClapp id (= DILOS Artikelnummer / AS key)
        ckTypeId: Industry.Logistics/Article
        fieldFilters:
          - attributePath: ArticleNumber
            operator: Equals                      # FieldFilterOperatorDto member (source-verified)
            comparisonValuePath: $.ck.ArticleNumber   # WeClappToCk writes the CkArticle FLAT at $.ck
        rtIdTargetPath: $.rt.articleRtId
        ckTypeIdTargetPath: $.rt.articleCkTypeId
        modOperationPath: $.rt.articleModOperation

      - type: CreateUpdateInfo@1
        description: Article attribute values (full list → WECLAPP-4228-MAPPING.md)
        path: $.ck
        rtIdPath: $.rt.articleRtId
        ckTypeId: Industry.Logistics/Article
        updateKindPath: $.rt.articleModOperation
        # attributeValueType is REQUIRED per update — a missing type is a debug-only error
        # and the update is silently dropped (ApplyChanges then logs "No update infos found").
        # No Sku here: neither the CK Article type nor CkArticle carries one.
        attributeUpdates:
          - attributeName: ArticleNumber
            attributeValueType: String
            valuePath: $.ck.ArticleNumber
          - attributeName: Name
            attributeValueType: String
            valuePath: $.ck.Name
          - attributeName: Ean
            attributeValueType: String
            valuePath: $.ck.Ean
        targetPath: $.updates
        targetValueWriteMode: Append      # collect into ONE list — the Overwrite default keeps only the last update

      - type: ApplyChanges@1
        description: Persist the article upsert
        path: $.updates
