# Pipeline: WeClapp articles → ONE DILOS AS file per Vienna calendar day (article master
# delivery). DilosExportRunKey@1 writes today's key { exportKind, exportDay, fileName } and the
# fetch, enrichment, render and delivery all run inside the dedup gate; CK persistence of
# articles lives in weclapp-articles-to-ck.yaml. WeClapp access comes from the tenant
# GlobalConfiguration entry "WeClappApi" (apiConfiguration below), SFTP from "LkvSftp".
#
# Delivery dedup (K1): a per-day CK marker (Industry.Logistics/ExportRun, keyed on
# meta.exportKind + meta.exportDay) gates the render/upload - at most ONE AS file per
# Vienna calendar day. The marker is persisted as the LAST step, only after a successful
# upload (at-least-once: a crash between upload and persist re-delivers on the next
# tick). Pattern mirrors the AI dedup gate (weclapp-orders-to-ai.yaml).
#
# Timing: with hourly cron ticks the delivery settles on the first tick after Vienna
# midnight; across the day boundary two deliveries in short succession are possible
# (yesterday's late run + today's early one) — deliberately accepted.
# The marker day AND the delivery file name are stamped together at DilosExportRunKey@1, from a
# single clock read, so they cannot name different days even when a run crosses Vienna midnight.
# System articles (LOADING_EQUIPMENT) are dropped by WeClappResolveSupplySources@1, which also
# projects the EK-Preis as a finished scalar - both are WeClapp rules a column model cannot express.
# Encoding: delivered as ISO-8859-1 (DILOS file format) — SftpUpload@1 defaults to UTF-8,
# so the encoding property on the delivery node is what keeps umlauts single-byte.

triggers:
  - type: FromPipelineTriggerEvent@1
  - type: FromExecutePipelineCommand@1

transformations:
  - type: DilosExportRunKey@1
    description: Today's export-run key (Vienna calendar day)
    exportKind: AS                  # keys the per-day delivery marker (Industry.Logistics/ExportRun)
    targetPath: $.meta              # { exportKind, exportDay, fileName }

  # --- K1 delivery-dedup gate: at most ONE AS delivery per Vienna calendar day.
  # GetOrCreate only queries (fresh id + ModOperation=Insert on miss); multiple
  # fieldFilters combine as AND. The marker is persisted by ApplyChanges@2 as the LAST
  # step, only after a successful upload. A tenant without Industry.Logistics fails
  # loud before querying - pipeline error, no delivery.
  - type: GetOrCreateRtEntitiesByType@1
    description: Probe today's AS export marker (query only - see gate note)
    ckTypeId: Industry.Logistics/ExportRun
    fieldFilters:
      - attributePath: ExportKind
        operator: Equals
        comparisonValuePath: $.meta.exportKind
      - attributePath: ExportDay
        operator: Equals
        comparisonValuePath: $.meta.exportDay
    rtIdTargetPath: $.rt.asExportRunRtId
    ckTypeIdTargetPath: $.rt.asExportRunCkTypeId
    modOperationPath: $.rt.asExportRunModOperation

  - type: If@1
    description: Deliver only when no marker for today exists (Insert = not delivered today)
    path: $.rt.asExportRunModOperation
    operator: Equal
    value: 0                    # UpdateKind.Insert (no delivery today yet)
    valueType: Enum
    transformations:
      # Both fetches sit INSIDE the gate: on a day that was already delivered this pipeline
      # makes no WeClapp request at all, so an outage cannot produce an hourly false alarm.
      - type: MakeHttpRequest@1
        description: Fetch all WeClapp articles for today's AS batch
        method: GET
        apiConfiguration: WeClappApi    # tenant GlobalConfiguration entry { baseUrl, apiKey }
        authHeaderName: AuthenticationToken
        url: /article
        targetPath: $.rawArticles
        paging:
          itemsPath: $.result
          pageSize: 100
        retry:
          maxAttempts: 4
          backoffBaseSeconds: 1
        timeoutSeconds: 60
        onHttpError: Throw              # NEVER omit: the default logs and finishes the run GREEN

      - type: MakeHttpRequest@1
        description: Fetch the articleSupplySource entities that carry the EK prices
        method: GET
        apiConfiguration: WeClappApi
        authHeaderName: AuthenticationToken
        url: /articleSupplySource
        targetPath: $.supplySources
        paging:
          itemsPath: $.result
          pageSize: 100
        retry:
          maxAttempts: 4
          backoffBaseSeconds: 1
        timeoutSeconds: 60
        # Throw matters most here: continuing without the prices would deliver an AS file with
        # every EK-Preis at 0 AND set the daily marker, so the wrong file would stand all day.
        onHttpError: Throw

      - type: WeClappResolveSupplySources@1
        description: Replace the supply-source stubs with the entities that carry the prices
        path: $.rawArticles
        supplySourcesPath: $.supplySources
        targetPath: $.items

      - type: RenderDelimitedText@1
        description: Render the article master lines (DILOS AS layout, one column per field)
        path: $.items
        targetPath: $.dilosAs
        delimiter: "|"
        # All three written out because they ARE the delivered bytes. Two of them match the node
        # defaults; lineEnding does not, and that is the one that must never be left out: the node
        # separates records with LF unless it is told otherwise, and the AS article master is
        # contracted as CR+LF - what _specs/AS.md asks for and what the partner fixed for this
        # delivery. The AI delivery stays LF, which the partner's own files show, so the two are
        # deliberately NOT the same and neither should be "harmonised" onto the other.
        # Changing this line is NOT the whole change, and THIS is the one place the coupled sites
        # are listed - everything else points here rather than repeating them. The separator is
        # pinned in five more places and all six move together or the suite reds:
        #   1. the layout guard AsYaml_RenderDelimitedText_SpellsOutTheThirtyFourColumnDilosLayout,
        #      which pins the PROPERTY, not its effective value - the yaml has to say CrLf out loud;
        #   2. the byte anchor AsDeliveryParityTests - a CR+LF closing every record and no stray CR
        #      or LF anywhere else;
        #   3. the frozen fixture it compares against, Fixtures/as-parity-expected.txt, which then
        #      has to be re-frozen deliberately;
        #   4. the AS chain test in PipelineChainIntegrationTests;
        #   5. the DilosRenderNodeConfiguration class doc, which carries the AS/AI split in prose.
        lineEnding: CrLf
        trailingNewLine: true               # the delivered file ends on 0x0D 0x0A
        onDelimiterInValue: Fail            # DILOS has no escaping - a '|' inside an article name
                                            # would shift every following column and the LKV import
                                            # would read the file without noticing
        columns:
          - value: "A*"                 #  1 Satzart
          - {}                          #  2 Kennzeichen
          - valuePath: $.id             #  3 Artikelnummer
            required: true              #    the ONE mandatory field per _specs/AS.md; an
                                        #    empty id would ship an unusable record
          - valuePath: $.name           #  4 Bezeichnung1
          - valuePath: $.articleNumber  #  5 Bezeichnung2
          - {}                          #  6 Artikelgruppe1
          - {}                          #  7 Artikelgruppe2
          - {}                          #  8 ABC
          - {}                          #  9 Merkmal1
          - {}                          # 10 Merkmal2
          - valuePath: $.ean            # 11 EAN
          - valuePath: $.unitName       # 12 Lagereinheit
          - {}                          # 13 Verpackungseinheit
          - {}                          # 14 Kartonmenge
          - {}                          # 15 Volumen
          - {}                          # 16 Gewicht
          - {}                          # 17 Laenge
          - {}                          # 18 Breite
          - {}                          # 19 Hoehe
          - valuePath: $.ekPreis        # 20 EK-Preis
          - {}                          # 21 Ursprungsland
          - {}                          # 22 Zolltarifnummer
          - value: "1"                  # 23 Artikelart
          - {}                          # 24 MwSt
          - {}                          # 25 Waehrung
          - {}                          # 26 Auswert1
          - {}                          # 27 Auswert2
          - {}                          # 28 Auswert3
          - {}                          # 29 Auswert4
          - {}                          # 30 Auswert5
          - {}                          # 31 Text1
          - {}                          # 32 Text2
          - {}                          # 33 Text3
          - {}                          # 34 Text4

      # The empty-batch brake. It has to live here rather than in the render: SftpUpload@1 uploads
      # an empty string as a 0-byte file, and the marker below is written after the upload, so an
      # empty delivery would burn the Vienna day. The comparison value is the empty STRING, and
      # path must be exactly the render's targetPath - If@1 reads a missing path as null, and
      # null != "" is TRUE, so a mistyped path here opens the gate instead of closing it.
      - type: If@1
        description: Deliver only when the render produced content (an empty batch must not burn the day)
        path: $.dilosAs
        operator: NotEqual
        value: ""
        valueType: String
        transformations:
          - type: SftpUpload@1
            description: Deliver the AS file to the LKV SFTP root as ISO-8859-1
            serverConfiguration: LkvSftp        # SAME tenant GlobalConfiguration as the return path
            remoteDirectory: /
            fileNamePath: $.meta.fileName       # AS<yyyyMMddHHmmss>.txt, Vienna local time
            path: $.dilosAs
            encoding: iso-8859-1                # NEVER omit: the default utf-8 corrupts umlauts
            onEncodingError: Replace            # one '?' per unrepresentable scalar, logged with its code point

          # attributeValueType is REQUIRED per update - without it the update is silently
          # dropped and the marker never persists.
          - type: CreateUpdateInfo@1
            description: Today's export marker - written ONLY after a successful upload
            path: $.meta
            rtIdPath: $.rt.asExportRunRtId
            ckTypeId: Industry.Logistics/ExportRun
            updateKindPath: $.rt.asExportRunModOperation
            attributeUpdates:
              - attributeName: ExportKind
                attributeValueType: String
                valuePath: $.meta.exportKind
              - attributeName: ExportDay
                attributeValueType: String
                valuePath: $.meta.exportDay
            targetPath: $.updates
            targetValueWriteMode: Append

          # ApplyChanges@1 is deprecated - @2 is the current node; associationUpdatesPath
          # is optional, this gate has no associations.
          - type: ApplyChanges@2
            description: Persist the marker (export dedup) - LAST step by contract
            entityUpdatesPath: $.updates
