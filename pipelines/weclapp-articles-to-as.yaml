# Pipeline: WeClapp articles → ONE DILOS AS file per Vienna calendar day (article master
# delivery). WeClappFetchStep@1 runs in emitMode: Batch and seeds one document
# { items: [ …all articles… ], meta: { exportKind, exportDate } }; CK persistence of
# articles lives in weclapp-articles-to-ck.yaml. WeClapp access comes from the tenant
# GlobalConfiguration entry "WeClappApi" (apiConfiguration below), SFTP from "LkvSftp".
#
# Delivery dedup (K1): a per-day CK marker (Industry.Logistics/ExportRun, keyed on
# meta.exportKind + meta.exportDate) gates the render/upload — at most ONE AS file per
# Vienna calendar day. The marker is persisted as the LAST step, only after a successful
# upload (at-least-once: a crash between upload and persist re-delivers on the next
# tick). Pattern mirrors the AI dedup gate (weclapp-orders-to-ai.yaml).
#
# Timing: with hourly cron ticks the delivery settles on the first tick after Vienna
# midnight; across the day boundary two deliveries in short succession are possible
# (yesterday's late run + today's early one) — deliberately accepted.
# System articles (LOADING_EQUIPMENT) are excluded by the AS render itself.
# Encoding: delivered as ISO-8859-1 (DILOS file format) — SftpUpload@1 defaults to UTF-8,
# so the encoding property on the delivery node is what keeps umlauts single-byte.

triggers:
  - type: FromPipelineTriggerEvent@1
  - type: FromExecutePipelineCommand@1

transformations:
  - type: WeClappFetchStep@1
    description: Fetch all WeClapp articles for today's AS batch
    apiConfiguration: WeClappApi  # tenant GlobalConfiguration entry { baseUrl, apiKey }
    entity: article
    emitMode: Batch               # one execution per run: { items: [ all articles ], meta: {...} }
    exportKind: AS                # keys the per-day delivery marker (Industry.Logistics/ExportRun)
    pageSize: 100
    # Each run also pulls articleSupplySource (EK price enrichment) — one extra fetch per run.

  # --- K1 delivery-dedup gate: at most ONE AS delivery per Vienna calendar day.
  # GetOrCreate only queries (fresh id + ModOperation=Insert on miss); multiple
  # fieldFilters combine as AND. The marker is persisted by ApplyChanges@2 as the LAST
  # step, only after a successful upload. A tenant without Industry.Logistics fails
  # loud before querying — pipeline error, no delivery.
  - type: GetOrCreateRtEntitiesByType@1
    description: Probe today's AS export marker (query only — see gate note)
    ckTypeId: Industry.Logistics/ExportRun
    fieldFilters:
      - attributePath: ExportKind
        operator: Equals
        comparisonValuePath: $.meta.exportKind
      - attributePath: ExportDate
        operator: Equals
        comparisonValuePath: $.meta.exportDate
    rtIdTargetPath: $.rt.asExportRunRtId
    ckTypeIdTargetPath: $.rt.asExportRunCkTypeId
    modOperationPath: $.rt.asExportRunModOperation

  - type: If@1
    description: Deliver only when no marker for today exists (Insert = not delivered today)
    path: $.rt.asExportRunModOperation
    operator: Equal
    value: 0                    # UpdateKind.Insert (no delivery today yet)
    valueType: Enum
    transformations:
      - type: DilosRender@1
        description: Render ALL article lines into one AS file per run
        mode: AS
        path: $.items
        targetPath: $.dilosAs
        fileNameTargetPath: $.dilosAsFileName   # AS<yyyyMMddHHmmss>.txt, Vienna local time

      - type: SftpUpload@1
        description: Deliver the AS file to the LKV SFTP root as ISO-8859-1
        serverConfiguration: LkvSftp        # SAME tenant GlobalConfiguration as the return path
        remoteDirectory: /
        fileNamePath: $.dilosAsFileName
        path: $.dilosAs
        encoding: iso-8859-1                # NEVER omit: the default utf-8 corrupts umlauts
        onEncodingError: Replace            # one '?' per unrepresentable scalar, logged with its code point

      # attributeValueType is REQUIRED per update — without it the update is silently
      # dropped and the marker never persists.
      - type: CreateUpdateInfo@1
        description: Today's export marker — written ONLY after a successful upload
        path: $.meta
        rtIdPath: $.rt.asExportRunRtId
        ckTypeId: Industry.Logistics/ExportRun
        updateKindPath: $.rt.asExportRunModOperation
        attributeUpdates:
          - attributeName: ExportKind
            attributeValueType: String
            valuePath: $.meta.exportKind
          - attributeName: ExportDate
            attributeValueType: String
            valuePath: $.meta.exportDate
        targetPath: $.updates
        targetValueWriteMode: Append

      # ApplyChanges@1 is deprecated — @2 is the current node; associationUpdatesPath
      # is optional, this gate has no associations.
      - type: ApplyChanges@2
        description: Persist the marker (export dedup) — LAST step by contract
        entityUpdatesPath: $.updates
