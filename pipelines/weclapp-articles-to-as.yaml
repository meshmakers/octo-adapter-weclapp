# Pipeline: WeClapp articles → ONE DILOS AS file per poll (daily article master delivery).
# The trigger runs in emitMode: Batch and emits a single execution shaped
# { "items": [ …all articles… ] } — golden precedent is ONE AS file per run
# (AS20240206020204.txt, 46 lines); per-item execution would produce N single-line
# files per poll. CK persistence of articles lives in weclapp-articles-to-ck.yaml
# (per-item) — split on purpose: two simple pipelines instead of one nested one,
# and the double poll is irrelevant at a daily interval.
#
# File name: DilosRender emits AS<yyyyMMddHHmmss>.txt (Vienna local time, Billbee
# precedent) into $.dilosAsFileName; SftpUpload reads it via fileNamePath.
#
# NOTE: the trigger enriches each article's supplySources reference stubs with the full
# articleSupplySource entities (EK prices) — one extra entity fetch per poll
# (customer-verified 2026-07-08; commit 0f521a2).
# ⚠ ENCODING: SftpUploadNode writes UTF-8; the golden (DILOS-import-proven) files are
# ISO-8859-1 (see weclapp-orders-to-ai.yaml header) — DilosSftpWrite@1 (Latin-1) is the
# planned follow-up; 32/48 customer articles carry non-ASCII in AS-relevant fields.

triggers:
  - type: WeClappFetch@1
    baseUrl: https://REPLACE-TENANT.weclapp.com/webapp/api/v1
    apiKey: ${WECLAPP_API_KEY}
    entity: article
    emitMode: Batch               # one execution per poll: { items: [ all articles ] }
    pageSize: 100
    pollingIntervalSeconds: 86400

transformations:
  - type: DilosRender@1
    description: Render ALL article lines into one AS file (golden precedent, one file per run)
    mode: AS
    path: $.items
    targetPath: $.dilosAs
    fileNameTargetPath: $.dilosAsFileName   # AS<yyyyMMddHHmmss>.txt, Vienna local time

  # --- File delivery (built-in SftpUpload@1) ---
  - type: SftpUpload@1
    description: Deliver the AS file to the LKV SFTP root
    serverConfiguration: LkvSftp        # SAME tenant GlobalConfiguration as the return path
    remoteDirectory: /
    fileNamePath: $.dilosAsFileName
    path: $.dilosAs
