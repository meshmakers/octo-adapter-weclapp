# Pipeline: DILOS AR shipment confirmations (LKV SFTP) → WeClapp shipments (tracking,
# parcels, delivered quantities, status SHIPPED last). SftpList@1 seeds $.files with one
# element per matching, ready file; a ForEach@1 then handles one file per iteration: it
# builds the file's marker key, probes the CK marker (Industry.Logistics/InboundFile) and,
# only for a file without marker, reads it, writes it to WeClapp and persists the marker.
# The delete runs afterwards, OUTSIDE that gate, so a tick that finds the marker already
# there (a delete an earlier tick could not finish) only deletes. The write is idempotent
# (replay-skip on an already SHIPPED shipment with the same tracking number; unknown orders
# are dead-letter-logged), and the marker survives pod restarts and redeploys.
#
# mode is configured HERE and nowhere else - the one SetPrimitiveValue@1 below. It is part
# of the marker key AND the condition of the delete: "dryRun" (the write node validates
# only, the marker records the dry run, nothing is deleted) or "live" (real write, live
# marker, delete behind the marker). A file validated in dryRun therefore runs once for
# real after the flip to live - the backlog rule of the go-live. Keep it "dryRun" while the
# write node's dryRun is true: a cron tick carries no execution mode, so this value is the
# only thing between a validation run and a consumed LKV file. A contract test pins the two
# together.
#
# SFTP access comes from the tenant GlobalConfiguration entry "LkvSftp", WeClapp access
# from "WeClappApi" (apiConfiguration below) — never from this YAML.

triggers:
  - type: FromPipelineTriggerEvent@1
  - type: FromExecutePipelineCommand@1

transformations:
  - type: SftpList@1
    description: List LKV SFTP for AR shipment-confirmation files
    serverConfiguration: LkvSftp
    remoteDirectory: "/"          # per-mandate subdirectory TBD with LKV
    filePattern: AR*TXT           # e.g. AR00006946.TXT
    minFileAgeSeconds: 60         # NEVER omit: the default 0 reads files still being written
    targetPath: $.files

  - type: SetPrimitiveValue@1
    description: Processing mode - the ONE place it is configured (dryRun | live)
    targetPath: $.mode
    value: dryRun                 # live ONLY together with dryRun: false on the write node
    valueType: String

  - type: ForEach@1
    description: Process one AR file per iteration
    iterationPath: $.files
    keyPath: $.current
    # mergePath stays unset and nothing may read $.loopResult — children write through
    # the data context instead. $.mode is read from the parent context (an iteration
    # context falls back to it).
    targetPath: $.loopResult         # NEVER omit: default "$" replaces the document root
    maxDegreeOfParallelism: 1        # NEVER omit: default 0 = Environment.ProcessorCount (parallel!)
    continueOnError: true            # a broken file is logged, the remaining files still run,
                                     # the run fails at the end; the broken file carries no
                                     # marker and is retried on the next tick
    transformations:
      # The file's identity, verbatim from the listing element (name, size, the listing's
      # own timestamp TEXT - re-formatting it would key an unchanged file differently from
      # one tick to the next) plus the mode.
      - type: FormatString@1
        description: Marker key of this file in this mode
        format: "{$.current.source.serverConfiguration}|{$.current.source.remoteDirectory}|{$.current.name}|{$.current.length}|{$.current.lastWriteTimeUtc}|{$.mode}"
        targetPath: $.fileKey

      # Query only (fresh id + ModOperation=Insert on miss), like the AS/AI dedup gates.
      - type: GetOrCreateRtEntitiesByType@1
        description: Probe the marker of this file (query only)
        ckTypeId: Industry.Logistics/InboundFile
        fieldFilters:
          - attributePath: FileKey
            operator: Equals
            comparisonValuePath: $.fileKey
        rtIdTargetPath: $.rt.inboundFileRtId
        ckTypeIdTargetPath: $.rt.inboundFileCkTypeId
        modOperationPath: $.rt.inboundFileModOperation

      - type: If@1
        description: Process only a file without marker (Insert = never processed in this mode)
        path: $.rt.inboundFileModOperation
        operator: Equal
        value: 0                    # UpdateKind.Insert
        valueType: Enum
        transformations:
          - type: SftpDownload@1
            description: Read this file's content as ISO-8859-1
            serverConfiguration: LkvSftp
            remotePathPath: $.current.fullPath
            encoding: iso-8859-1          # NEVER omit: the default utf-8 turns Latin-1 umlauts
                                          # into replacement characters without failing anything
            targetPath: $.fileContent     # iteration-local: ForEach@1 gives each item its own context

          - type: WeClappArWrite@1
            description: Write AR shipments back to WeClapp (create/update shipment, tracking, SHIPPED last)
            apiConfiguration: WeClappApi  # tenant GlobalConfiguration entry { baseUrl, apiKey }
            fileNamePath: $.current.name
            contentPath: $.fileContent
            dryRun: true                  # validate-only; false ONLY together with mode: live

          - type: DateTime@1
            description: Processing timestamp of the marker
            operation: Now
            targetPath: $.processedAt

          # attributeValueType is REQUIRED per update - without it the update is silently
          # dropped and the marker never persists.
          - type: CreateUpdateInfo@1
            description: The marker - persisted ONLY after a successful write
            path: $.current
            rtIdPath: $.rt.inboundFileRtId
            ckTypeId: Industry.Logistics/InboundFile
            updateKindPath: $.rt.inboundFileModOperation
            attributeUpdates:
              - attributeName: FileKey
                attributeValueType: String
                valuePath: $.fileKey
              - attributeName: SourceName
                attributeValueType: String
                valuePath: $.current.source.serverConfiguration
              - attributeName: SourceDirectory
                attributeValueType: String
                valuePath: $.current.source.remoteDirectory
              - attributeName: FileName
                attributeValueType: String
                valuePath: $.current.name
              - attributeName: FileSize
                attributeValueType: Int64
                valuePath: $.current.length
              - attributeName: LastWriteUtc
                attributeValueType: DateTime
                valuePath: $.current.lastWriteTimeUtc
              - attributeName: ProcessedAt
                attributeValueType: DateTime
                valuePath: $.processedAt
            targetPath: $.updates
            targetValueWriteMode: Append   # NEVER omit

          - type: ApplyChanges@2
            description: Persist the marker - LAST step inside the gate by contract
            entityUpdatesPath: $.updates

      # OUTSIDE the marker gate, so a repeated tick settles a delete an earlier tick still
      # owes. Guarded by the mode, because SftpDelete@1 honours the execution mode only,
      # which a cron tick never carries.
      - type: If@1
        description: Delete the LKV file only in live mode, and only behind a persisted marker
        path: $.mode
        operator: Equal
        value: live
        valueType: String
        transformations:
          - type: SftpDelete@1
            description: Remove the processed file from the LKV SFTP
            serverConfiguration: LkvSftp
            remotePathPath: $.current.fullPath
            onMissingFile: Ignore         # NEVER omit: the default is Fail. A listed file is only
                                          # gone if someone else removed it inside this tick, and
                                          # the marker is persisted by now - goal state reached
