# Pipeline: DILOS AR shipment confirmations (LKV SFTP) → WeClapp shipments (tracking,
# parcels, delivered quantities, status SHIPPED last). DilosFileFetchStep@1 seeds
# $.files (one element per matching, ready file); a ForEach@1 processes one file per
# iteration. The write is idempotent (replay-skip on an already SHIPPED shipment with
# the same tracking number; unknown orders are dead-letter-logged), so re-running a
# kept file on the next tick is safe.
#
# DilosFileFetchStep@1 and DilosFileConfirm@1 MUST carry the SAME deleteAfterSuccess —
# the step gates the keep-mode skip / pending-delete retry, the confirm node (LAST
# child) performs the actual delete, only after a successful write; a mismatch leaves
# files stuck. Keep both false while dryRun is on: DilosFileConfirm@1 never sees the
# write node's dryRun — it would delete the LKV file although nothing was written.
#
# SFTP access comes from the tenant GlobalConfiguration entry "LkvSftp", WeClapp access
# from "WeClappApi" (apiConfiguration below) — never from this YAML.

triggers:
  - type: FromPipelineTriggerEvent@1
  - type: FromExecutePipelineCommand@1

transformations:
  - type: DilosFileFetchStep@1
    description: List LKV SFTP for AR shipment-confirmation files
    serverConfiguration: LkvSftp
    remoteDirectory: "/"          # per-mandate subdirectory TBD with LKV
    filePattern: AR*TXT           # e.g. AR00006946.TXT
    minFileAgeSeconds: 60
    deleteAfterSuccess: false     # MUST match DilosFileConfirm@1 below; flip to true
                                  # ONLY together with dryRun: false (go-live, see header)

  - type: ForEach@1
    description: Process one AR file per iteration
    iterationPath: $.files
    keyPath: $.current
    # mergePath stays unset and nothing may read $.loopResult — children write through
    # the data context instead.
    targetPath: $.loopResult         # NEVER omit: default "$" replaces the document root
    maxDegreeOfParallelism: 1        # NEVER omit: default 0 = Environment.ProcessorCount (parallel!)
    continueOnError: true            # needs SDK >= r3.4.91: a broken file is logged, the
                                     # remaining files still run, the run fails at the end;
                                     # the broken file stays unconfirmed and is retried
    transformations:
      - type: WeClappArWrite@1
        description: Write AR shipments back to WeClapp (create/update shipment, tracking, SHIPPED last)
        apiConfiguration: WeClappApi  # tenant GlobalConfiguration entry { baseUrl, apiKey }
        fileNamePath: $.current.fileName
        contentPath: $.current.content
        dryRun: true                  # validate-only; set to false for go-live, together
                                      # with deleteAfterSuccess: true on step and confirm

      - type: DilosFileConfirm@1
        description: Confirm the AR file — keep it on the server (dry-run) or delete it once dryRun is off
        serverConfiguration: LkvSftp
        deleteAfterSuccess: false   # MUST match DilosFileFetchStep@1 above
        path: $.current             # the ONE current file — never $.files (parent-fallback
                                    # would resolve the whole array and delete unrun files)
