# Pipeline: DILOS AR shipment confirmations (LKV SFTP) → WeClapp shipments (tracking, parcels,
# delivered quantities, status SHIPPED last). One pipeline execution per fetched file
# ({fileName, content}); with deleteAfterSuccess: true the trigger deletes the remote file
# only after this pipeline completed successfully — safe because the write is idempotent
# (replay-skip on an already SHIPPED shipment with the same tracking number; unknown orders
# are dead-letter-logged and do not block the file). During the dry-run phase the delete
# stays off: a dry-run succeeds without writing, deleting would consume the file for nothing.
#
# SFTP credentials come from the tenant GlobalConfiguration entry "LkvSftp" (same JSON shape
# as SftpUpload@1: {host, port, username, password|privateKey, ...}) — never from this YAML.
# ${WECLAPP_API_KEY} is substituted at deploy time (see scripts/om_setup_lkv.ps1).

triggers:
  - type: DilosFileFetch@1
    serverConfiguration: LkvSftp
    remoteDirectory: "/"          # Billbee production default; per-mandate subdirectory TBD with LKV
    filePattern: AR*TXT           # golden names: AR00006946.TXT, AR20240205143134947.TXT
    pollingIntervalSeconds: 900   # Billbee parity: */15 min
    minFileAgeSeconds: 60
    deleteAfterSuccess: false     # dry-run below writes nothing — deleting would consume the
                                  # LKV file with no effect; flip to true TOGETHER with dryRun

transformations:
  - type: WeClappArWrite@1
    description: Write AR shipments back to WeClapp (create/update shipment, tracking, SHIPPED last)
    baseUrl: https://REPLACE-TENANT.weclapp.com/webapp/api/v1
    apiKey: ${WECLAPP_API_KEY}
    dryRun: true                  # validate-only until the trial write smoke passed; flip for go-live
