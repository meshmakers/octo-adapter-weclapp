# Pipeline: DILOS AR shipment confirmations (LKV SFTP) → WeClapp shipments (tracking, parcels,
# delivered quantities, status SHIPPED last). DilosFileFetchStep@1 lists the LKV SFTP server
# (cron-driven; replaces the old DilosFileFetch@1 poll-loop trigger) and seeds $.files = one
# element per matching, ready file; a ForEach@1 runs the former per-execution chain once per
# element (one iteration per file) — the write is idempotent (replay-skip on an already SHIPPED
# shipment with the same tracking number; unknown orders are dead-letter-logged and do not
# block the file), so re-running a kept file on the next tick is safe. DilosFileConfirm@1 is the
# LAST child: with deleteAfterSuccess: true it deletes the remote file only after the write
# succeeded — safe for the same idempotency reason. During the dry-run phase the delete stays
# off: a dry-run succeeds without writing, deleting would consume the file for nothing.
#
# DeleteAfterSuccess consistency: DilosFileFetchStep@1 and DilosFileConfirm@1 below MUST carry
# the SAME value — the step gates the keep-mode skip / pending-delete retry, the confirm node
# performs the actual first-time delete; a mismatch leaves files stuck in an inconsistent state.
#
# SFTP credentials come from the tenant GlobalConfiguration entry "LkvSftp" (same JSON shape
# as SftpUpload@1: {host, port, username, password|privateKey, ...}) — never from this YAML.
# WeClapp access comes from the entry "WeClappApi" (apiConfiguration below) the same way.

triggers:
  - type: FromPipelineTriggerEvent@1
  - type: FromExecutePipelineCommand@1

transformations:
  - type: DilosFileFetchStep@1
    description: List LKV SFTP for AR shipment-confirmation files (cron-driven; replaces the old DilosFileFetch@1 poll-loop trigger)
    serverConfiguration: LkvSftp
    remoteDirectory: "/"          # Billbee production default; per-mandate subdirectory TBD with LKV
    filePattern: AR*TXT           # golden names: AR00006946.TXT, AR20240205143134947.TXT
    minFileAgeSeconds: 60
    # deleteAfterSuccess MUST match DilosFileConfirm@1's deleteAfterSuccess below — this step
    # gates the keep-mode skip / pending-delete retry, the confirm node performs the actual
    # first-time delete; a mismatch leaves files stuck in an inconsistent state.
    deleteAfterSuccess: false     # dry-run below writes nothing — deleting would consume the
                                  # LKV file with no effect; flip to true TOGETHER with dryRun

  - type: ForEach@1
    description: per-item chain, one former execution per element
    iterationPath: $.files
    keyPath: $.current
    # no mergePath: the default ($.key) merges nothing — nothing may read $.loopResult anyway,
    # and merging $.current would deep-clone every item’s full content into the result array.
    targetPath: $.loopResult         # NEVER omit: default "$" REPLACES the document root.
                                     # Merge results keep source order since AB#4760; nothing reads $.loopResult anyway.
    maxDegreeOfParallelism: 1        # NEVER omit: default 0 = Environment.ProcessorCount (parallel!)
    continueOnError: true            # AB#4785 (needs SDK >= r3.4.90): a structurally broken file no
                                     # longer starves the files behind it — its error is logged and
                                     # collected, the remaining files are processed, and the run still
                                     # fails at the end (failure counters stay loud). The broken file
                                     # stays unconfirmed and is retried next tick.
    transformations:
      - type: WeClappArWrite@1
        description: Write AR shipments back to WeClapp (create/update shipment, tracking, SHIPPED last)
        apiConfiguration: WeClappApi  # tenant GlobalConfiguration entry { baseUrl, apiKey }
        fileNamePath: $.current.fileName
        contentPath: $.current.content
        dryRun: true                  # validate-only; flip for go-live TOGETHER with both deleteAfterSuccess values

      - type: DilosFileConfirm@1
        description: Confirm the AR file — keep it on the server (dry-run) or delete it once dryRun is off
        serverConfiguration: LkvSftp
        # deleteAfterSuccess MUST match DilosFileFetchStep@1's deleteAfterSuccess above (see note there).
        deleteAfterSuccess: false
        path: $.current             # the ONE current file element — never $.files (would resolve to
                                    # the whole array via ForEach's parent-fallback and delete unrun files)
