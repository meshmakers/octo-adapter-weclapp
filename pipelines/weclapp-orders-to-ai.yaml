# Pipeline: WeClapp sales orders → CK entities + DILOS AI file content (one file per
# order, file name = Auftragsnummer1). MakeHttpRequest@1 seeds $.orders (cron-driven);
# a ForEach@1 processes one order per iteration and looks up that order's customer itself.
#
# WeClapp access comes from the tenant GlobalConfiguration entry "WeClappApi"
# (apiConfiguration below), SFTP access from the entry "LkvSftp".

triggers:
  - type: FromPipelineTriggerEvent@1
  - type: FromExecutePipelineCommand@1

transformations:
  - type: MakeHttpRequest@1
    description: Fetch confirmed WeClapp orders for AI delivery
    method: GET
    apiConfiguration: WeClappApi    # tenant GlobalConfiguration entry { baseUrl, apiKey }
    authHeaderName: AuthenticationToken
    # Only confirmed orders go to LKV - WeClapp allows createShipment (needed for the
    # AR return path) only in this status. The customer's historical order stock is
    # CLOSED, so this status filter is the ONLY flood guard against mass-delivering the
    # backlog - the dedup gate below cannot stop first-time deliveries.
    # orderItems are part of the default salesOrder response.
    url: /salesOrder?status-eq=ORDER_CONFIRMATION_PRINTED
    targetPath: $.orders            # flat array of raw orders, one ForEach iteration each
    paging:
      itemsPath: $.result
      pageSize: 100
    retry:
      maxAttempts: 4
      backoffBaseSeconds: 1
    timeoutSeconds: 60
    onHttpError: Throw              # NEVER omit: the default logs and finishes the run GREEN

  - type: ForEach@1
    description: Process one order per iteration
    iterationPath: $.orders
    keyPath: $.current
    # mergePath stays unset and nothing may read $.loopResult — children write through
    # the data context instead.
    targetPath: $.loopResult         # NEVER omit: default "$" replaces the document root
    maxDegreeOfParallelism: 1        # NEVER omit: default 0 = Environment.ProcessorCount (parallel!)
    continueOnError: true            # one order whose customer fails must not starve the others
    transformations:
      - type: MakeHttpRequest@1
        description: Look up this order's customer
        method: GET
        apiConfiguration: WeClappApi
        authHeaderName: AuthenticationToken
        url: /customer?id-eq={customerId}
        pathParameters:
          - name: customerId
            valuePath: $.current.customerId
        targetPath: $.customerResponse    # raw response; the record sits under result[0]
        retry:
          maxAttempts: 4
          backoffBaseSeconds: 1
        timeoutSeconds: 60
        # Throw is what makes the isolation above work: ForEach@1 catches a typed failure and
        # keeps going, while the default would skip this order silently and report success.
        onHttpError: Throw

      - type: WeClappToCk@1
        description: WeClapp order + customer -> CK-shaped document
        mode: Order
        path: $.current                             # the fetched array is flat
        customerPath: $.customerResponse.result[0]  # the single match of the id-eq lookup
        targetPath: $.ck

      # --- Export dedup: lookups outside the gate (query-only), everything that renders,
      # delivers or persists inside it. The persisted CK Order doubles as the export
      # marker and is written ONLY after a successful upload (at-least-once: a crash
      # between upload and persist re-delivers on the next tick).
      - type: GetOrCreateRtEntitiesByType@1
        description: Look up the Customer by its WeClapp customer number (query only, see gate note)
        ckTypeId: Industry.Logistics/Customer
        fieldFilters:
          - attributePath: CustomerNumber
            operator: Equals                      # FieldFilterOperatorDto member
            comparisonValuePath: $.ck.Customer.CustomerNumber
        rtIdTargetPath: $.rt.customerRtId
        ckTypeIdTargetPath: $.rt.customerCkTypeId
        modOperationPath: $.rt.customerModOperation

      - type: GetOrCreateRtEntitiesByType@1
        description: Look up the Order by its WeClapp id (= Auftragsnummer1) — the export marker probe
        ckTypeId: Industry.Logistics/Order
        fieldFilters:
          - attributePath: OrderNumber
            operator: Equals
            comparisonValuePath: $.ck.Order.OrderNumber
        rtIdTargetPath: $.rt.orderRtId
        ckTypeIdTargetPath: $.rt.orderCkTypeId
        modOperationPath: $.rt.orderModOperation

      - type: If@1
        description: Deliver only orders whose CK entity does not exist yet (ModOperation Insert = never exported)
        path: $.rt.orderModOperation
        operator: Equal
        value: 0                    # UpdateKind.Insert (never exported yet)
        valueType: Enum
        transformations:
          # attributeValueType is REQUIRED per update — without it the update is silently
          # dropped and the gate never persists its marker.
          - type: CreateUpdateInfo@1
            description: Customer attribute values onto the upserted entity (list still partial — full mapping tracked under AB#4228)
            path: $.ck.Customer
            rtIdPath: $.rt.customerRtId
            ckTypeId: Industry.Logistics/Customer
            updateKindPath: $.rt.customerModOperation # Insert|Update as decided by the lookup node
            attributeUpdates:
              - attributeName: CustomerNumber
                attributeValueType: String
                valuePath: $.ck.Customer.CustomerNumber
              - attributeName: Name
                attributeValueType: String
                # CkCustomer.Name carries the B2C fallback (company name OR "first last")
                valuePath: $.ck.Customer.Name
            targetPath: $.updates
            targetValueWriteMode: Append      # NEVER omit: the Overwrite default keeps only the LAST update

          - type: CreateUpdateInfo@1
            description: Order attribute values (list still partial — full mapping tracked under AB#4228)
            path: $.ck.Order
            rtIdPath: $.rt.orderRtId
            ckTypeId: Industry.Logistics/Order
            updateKindPath: $.rt.orderModOperation
            attributeUpdates:
              - attributeName: OrderNumber
                attributeValueType: String
                valuePath: $.ck.Order.OrderNumber
              - attributeName: ExternalOrderNumber
                attributeValueType: String
                valuePath: $.ck.Order.ExternalOrderNumber
              - attributeName: OrderDate
                attributeValueType: DateTime
                valuePath: $.ck.Order.OrderDate
            targetPath: $.updates
            targetValueWriteMode: Append

          - type: CreateAssociationUpdate@1
            description: Order → Customer (role from the imported Industry.Logistics CK)
            updateKind: Create
            originRtIdPath: $.rt.orderRtId
            originCkTypeId: Industry.Logistics/Order
            targetRtIdPath: $.rt.customerRtId
            targetCkTypeId: Industry.Logistics/Customer
            associationRoleId: Industry.Logistics/OrderCustomer
            # Association updates are a DIFFERENT type than entity updates — own list;
            # ApplyChanges@2 consumes both lists separately.
            targetPath: $.associationUpdates
            targetValueWriteMode: Append

          - type: DilosRender@1
            description: Render the AI file content for this order (K* + P* + shipping -1 line)
            mode: AI
            submandant: "51696697501"   # REPLACE per tenant: WeClapp-Mandanten-Kennung (LKV maps it)
            path: $.current
            targetPath: $.dilosAi
            fileNameTargetPath: $.dilosAiFileName   # AI<Auftragsnummer1>.txt — the WeClapp id,
                                                    # NOT the shop orderNumber

          # ISO-8859-1 delivery (DILOS file format) — SftpUpload@1 defaults to UTF-8, so the
          # encoding property is what keeps umlauts single-byte; non-Latin-1 characters are
          # replaced with '?'.
          - type: SftpUpload@1
            description: Deliver the AI file to the LKV SFTP root as ISO-8859-1 (delete-side handled by LKV)
            serverConfiguration: LkvSftp        # SAME tenant GlobalConfiguration as the return path
            remoteDirectory: /
            fileNamePath: $.dilosAiFileName
            path: $.dilosAi
            encoding: iso-8859-1                # NEVER omit: the default utf-8 corrupts umlauts
            onEncodingError: Replace            # one '?' per unrepresentable scalar, logged with its code point

          # Persisting the CK entities IS the export marker — MUST stay the last step so a
          # failed upload leaves no marker (the order is retried on the next tick).
          - type: ApplyChanges@2
            description: Persist order + customer AFTER successful delivery (export marker, at-least-once)
            entityUpdatesPath: $.updates
            associationUpdatesPath: $.associationUpdates
