# Pipeline: DILOS BE stock snapshots (LKV SFTP) → WeClapp stock movement deltas.
# warehouseStock is GET-only in the WeClapp API, so the node books bookIncomingMovement /
# bookOutgoingMovement per BE-vs-current difference. Idempotent by construction:
# re-processing the same file yields delta 0. GES (blocked) lines and unknown articles
# are skipped loudly. SftpList@1 seeds $.files with one element per matching, ready file;
# DilosFileGate@1 drops the ones an earlier tick already dealt with and stamps the rest;
# a ForEach@1 then reads and processes one file per iteration.
#
# deleteAfterSuccess is configured HERE and nowhere else: DilosFileGate@1 stamps it into
# every file element, DilosFileConfirm@1 (LAST child) reads it from there and performs the
# delete after a successful write. Keep it false while dryRun is on — the confirm node
# never sees the write node's dryRun and would delete an LKV file although nothing was
# written.
#
# SFTP access comes from the tenant GlobalConfiguration entry "LkvSftp", WeClapp access
# from "WeClappApi" (apiConfiguration below) — never from this YAML.

triggers:
  - type: FromPipelineTriggerEvent@1
  - type: FromExecutePipelineCommand@1

transformations:
  - type: SftpList@1
    description: List LKV SFTP for BE stock-snapshot files
    serverConfiguration: LkvSftp
    remoteDirectory: "/"          # per-mandate subdirectory TBD with LKV
    filePattern: BE*txt           # e.g. BE_20240205035403463.txt
    minFileAgeSeconds: 60         # NEVER omit: the default 0 reads files still being written
    targetPath: $.files

  - type: DilosFileGate@1
    description: Drop files an earlier tick confirmed and stamp the rest for the confirm node
    path: $.files                 # must match the listing's targetPath above
    deleteAfterSuccess: false     # the ONE place this is configured; flip to true ONLY
                                  # together with dryRun: false (go-live, see header)

  - type: ForEach@1
    description: Process one BE file per iteration
    iterationPath: $.files
    keyPath: $.current
    # mergePath stays unset and nothing may read $.loopResult — children write through
    # the data context instead.
    targetPath: $.loopResult         # NEVER omit: default "$" replaces the document root
    maxDegreeOfParallelism: 1        # NEVER omit: default 0 = Environment.ProcessorCount (parallel!)
    continueOnError: true            # needs SDK >= r3.4.91: a broken file is logged, the
                                     # remaining files still run, the run fails at the end;
                                     # the broken file stays unconfirmed and is retried
    transformations:
      - type: SftpDownload@1
        description: Read this file's content as ISO-8859-1
        serverConfiguration: LkvSftp
        remotePathPath: $.current.fullPath
        encoding: iso-8859-1          # NEVER omit: the default utf-8 turns Latin-1 umlauts
                                      # into replacement characters without failing anything
        targetPath: $.fileContent     # iteration-local: ForEach@1 gives each item its own context

      - type: WeClappBeWrite@1
        description: Reconcile the BE stock snapshot into WeClapp via delta movement bookings
        apiConfiguration: WeClappApi  # tenant GlobalConfiguration entry { baseUrl, apiKey }
        fileNamePath: $.current.name
        contentPath: $.fileContent
        warehouseId: "4156"           # customer main warehouse (Hauptlager)
        dryRun: true                  # movements are logged, not booked; set to false for
                                      # go-live, together with deleteAfterSuccess: true on
                                      # the gate

      - type: DilosFileConfirm@1
        description: Confirm the BE file — keep it on the server or delete it, as the gate stamped
        path: $.current             # the ONE current file — never $.files (parent-fallback
                                    # would resolve the whole array and confirm unrun files)
